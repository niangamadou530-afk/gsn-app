name: CI Espaces MJS / MCTN

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  verifier:
    # Ne se déclenche QUE pour les branches urgentes ciblées
    if: github.head_ref == 'branche-mjs' || github.head_ref == 'branche-mctn'
    runs-on: ubuntu-latest
    env:
      ESPACE: ${{ github.head_ref == 'branche-mjs' && 'mjs' || 'mctn' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # ---- COUCHE AUTO-CORRECTION ----
      - name: Lint avec correction automatique
        run: npx eslint . --fix || true

      - name: Commit des corrections automatiques
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: corrections lint automatiques 🤖"

      # ---- COUCHE VERIFICATION ----
      - name: Lint final (bloquant)
        run: npx eslint .

      - name: Build de l'application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Installer Playwright
        run: npx playwright install --with-deps chromium

      - name: Démarrer l'application
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # ---- COUCHE EXIGENCES FONCTIONNELLES ----
      - name: Tests de l'espace ${{ env.ESPACE }}
        run: npx playwright test tests/espaces --reporter=list
        env:
          BASE_URL: http://localhost:3000
          ESPACE: ${{ env.ESPACE }}

  # ---- COUCHE AUTO-MERGE ----
  auto-merge:
    needs: verifier
    if: github.head_ref == 'branche-mjs' || github.head_ref == 'branche-mctn'
    runs-on: ubuntu-latest
    steps:
      - name: Activer le merge automatique
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
